# TEMPORARY Phase 6C Windows verification workflow.
# Runs the organic paper-silhouette verification on a real windows-latest
# runner and uploads renders + a JSON report as artifacts.
# This file is deleted again once the verification results are collected.
name: phase6c-windows-verification

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0e01c-af-sticky-note
    paths:
      - ".github/workflows/phase6c-windows-verification.yml"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.7.2" pytest
          python -c "import PySide6; print('PySide6', PySide6.__version__)"

      - name: Portable backend suite
        shell: pwsh
        run: python scripts/run_all_backend_tests.py

      - name: Focused shape tests
        shell: pwsh
        run: python -m pytest tests/test_note_shape.py -q

      - name: Windows shape verification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          python verify_windows_shape.py 2>&1 | Tee-Object -FilePath artifacts\verification.log
          Get-ChildItem artifacts

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6c-windows-verification
          path: artifacts/
          if-no-files-found: error
