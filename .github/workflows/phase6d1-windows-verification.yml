name: phase6d1-windows-verification

# Phase 6D.1 -- real-Windows verification of the QSS fix and the Priority UX.
# Temporary: added to obtain genuine Windows results, removed afterwards, the
# same way the Phase 6C harness was handled.
#
# Results return as check-run annotations, because the Actions log and artifact
# endpoints are not reachable from the development sandbox.
on:
  push:
    branches:
      - arena/01a0e01c-af-sticky-note

permissions:
  contents: read

jobs:
  windows-priority:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PySide6
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.7.2" pytest

      # One step does everything, so a failure anywhere still produces a full
      # report instead of skipping the remaining steps.
      - name: Windows priority verification
        shell: pwsh
        run: python scripts/verify_windows_priority.py

      # GitHub only returns a handful of annotations per check-run, so the
      # platform-regression checks (window flags, taskbar / Alt+Tab, tray,
      # desktop layer, geometry) are re-emitted on their own to make sure their
      # actual values come back.
      - name: Windows platform regression detail
        shell: pwsh
        run: python scripts/verify_windows_priority.py --annotate "window,tray,desktop,geometry,minimum"
