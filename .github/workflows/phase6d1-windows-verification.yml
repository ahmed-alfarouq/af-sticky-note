name: phase6d1-windows-verification

# Phase 6D.1 -- real-Windows verification of the QSS fix and the Priority UX.
# Temporary: added to obtain genuine Windows results, removed afterwards, the
# same way the Phase 6C harness was handled.
on:
  push:
    branches:
      - arena/01a0e01c-af-sticky-note

permissions:
  contents: read

jobs:
  windows-priority:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PySide6
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.7.2"

      - name: Focused priority tests (real Windows)
        shell: pwsh
        run: |
          python -m pytest tests/test_app_stylesheet.py tests/test_task_priority_ux.py -q

      - name: Windows priority verification
        id: verify
        shell: pwsh
        run: |
          python scripts/verify_windows_priority.py
        continue-on-error: true

      - name: Record outcome
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.verify.outcome }}" -eq "failure") {
            Write-Host "::error title=phase6d1-outcome::Windows priority verification reported failures"
            exit 1
          }
          Write-Host "::notice title=phase6d1-outcome::Windows priority verification passed"
