name: phase6e-ui-refinement-verification

# Temporary real-Windows verification for the Phase 6E UI/UX refinement audit.
# Deleted once the results have been captured (Phase 6C / 6D.1 precedent).
#
# Everything is folded into ONE script and ONE step:
#   * a failing separate step skips every later step and loses the report;
#   * `continue-on-error: true` would report `success` even when the script
#     exits non-zero, which reads as a false "verification passed";
#   * the log/artifact endpoints redirect to Azure blob storage and are
#     unreachable from the authoring sandbox, so the script re-emits its whole
#     log as GitHub Actions annotations (failures first) from a `finally`
#     block, which is the only channel that survives.
#
# GitHub returns only ~10 annotations per check-run, so the same script runs
# several times with a different `--annotate` substring filter to recover the
# full set of PASS lines. Each pass re-verifies the product from scratch.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0e01c-af-sticky-note
    paths:
      - "app/ui/**"
      - "app/platform/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/phase6e-ui-refinement-verification.yml"

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PySide6
        run: python -m pip install --quiet "PySide6==6.7.2"

      # Pass 1 -- the paper, window and platform layer.
      - name: Phase 6E verification (paper and platform)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          python scripts/verify_phase6e_ui_refinement.py --annotate "paper,mask,flags,taskbar,geometry,desktop,resize,explorer,minimum,START,summary"
          if ($LASTEXITCODE -ne 0) { throw "Phase 6E verification (pass 1) reported failures" }
        env:
          QT_QPA_PLATFORM: windows

      # Pass 2 -- the interaction and styling checks.
      - name: Phase 6E verification (interaction and styling)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          python scripts/verify_phase6e_ui_refinement.py --annotate "task,selector,priority,edit,history,settings,tray,dpi,qss"
          if ($LASTEXITCODE -ne 0) { throw "Phase 6E verification (pass 2) reported failures" }
        env:
          QT_QPA_PLATFORM: windows
